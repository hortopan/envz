[package]
name = "envz"
version = "0.1.2"
edition = "2024"
description = "Secure environment variable management with AES-256-GCM encryption and macOS Keychain storage"
license = "MIT"
repository = "https://github.com/hortopan/envz"
homepage = "https://github.com/hortopan/envz"
authors = ["Alex Hortopan"]

[[bin]]
name = "envz"
path = "src/main.rs"

[profile.release]
lto = "thin"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
dialoguer = "0.11"
thiserror = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
litcrypt = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
core-foundation = "0.10"
