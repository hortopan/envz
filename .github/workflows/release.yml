name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

# Required GitHub Secrets:
#   APPLE_TEAM_ID              - Apple Developer Team ID (e.g., U5QRGK7YUQ)
#   BUNDLE_ID                  - App bundle identifier (e.g., net.gnarlylabs.envz)
#   APPLE_SIGNING_IDENTITY     - Full codesign identity (e.g., "Developer ID Application: Your Name (U5QRGK7YUQ)")
#   APPLE_CERTIFICATE          - Base64-encoded .p12 Developer ID Application certificate
#   APPLE_CERTIFICATE_PASSWORD - Password for the .p12 certificate
#   APPLE_NOTARY_APPLE_ID      - Apple ID email for notarization
#   APPLE_NOTARY_PASSWORD      - App-specific password for notarization
#   HOMEBREW_TAP_TOKEN         - GitHub PAT with repo access to hortopan/homebrew-tap

jobs:
  build:
    name: Build & Sign (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          ENVZ_APP_SECRET: ${{ secrets.ENVZ_APP_SECRET }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Prepare entitlements
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          sed -e "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" \
              -e "s/BUNDLE_ID_PLACEHOLDER/$BUNDLE_ID/g" \
              entitlements.plist > "$RUNNER_TEMP/entitlements.plist"

      - name: Code sign binary
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          BINARY="target/${{ matrix.target }}/release/envz"

          codesign -f -s "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --timestamp \
            "$BINARY"

          echo "==> Verifying signature..."
          codesign -dvv "$BINARY" 2>&1

      - name: Notarize binary
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BINARY="target/${{ matrix.target }}/release/envz"
          ZIP_PATH="$RUNNER_TEMP/envz-notarize.zip"

          ditto -c -k --keepParent "$BINARY" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../envz-${{ matrix.target }}.tar.gz envz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: envz-${{ matrix.target }}
          path: envz-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        id: checksums
        run: |
          echo "arm64_sha=$(sha256sum artifacts/envz-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha=$(sha256sum artifacts/envz-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: hortopan/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Write formula
        run: |
          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/envz.rb << 'FORMULA'
          class Envz < Formula
            desc "Secure environment variable management with AES-256-GCM encryption and macOS Keychain"
            homepage "https://github.com/hortopan/envz"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/hortopan/envz/releases/download/vVERSION_PLACEHOLDER/envz-aarch64-apple-darwin.tar.gz"
                sha256 "ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/hortopan/envz/releases/download/vVERSION_PLACEHOLDER/envz-x86_64-apple-darwin.tar.gz"
                sha256 "X86_64_SHA_PLACEHOLDER"
              end
            end

            def install
              bin.install "envz"
            end

            test do
              assert_match "envz", shell_output("#{bin}/envz --help")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${{ steps.version.outputs.version }}/g" homebrew-tap/Formula/envz.rb
          sed -i "s/ARM64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.arm64_sha }}/g" homebrew-tap/Formula/envz.rb
          sed -i "s/X86_64_SHA_PLACEHOLDER/${{ steps.checksums.outputs.x86_64_sha }}/g" homebrew-tap/Formula/envz.rb

      - name: Commit and push formula
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/envz.rb
          git commit -m "Update envz to ${{ steps.version.outputs.version }}"
          git push
